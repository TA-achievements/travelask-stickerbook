    ["Зимний пазл", "Собрать небольшой пазл с зимним сюжетом. Подойдёт и онлайн-пазл."],
    ["Праздничный образ", "Примерить наряд на Новый год и выбрать одну деталь, которая поднимает настроение."],
    ["Новогодний фильм", "Посмотреть новогодний фильм, который создаёт настоящее праздничное настроение."],
    ["Танцевальная пауза", "Разучить пару танцевальных движений и устроить себе минуту танцев."],
    ["Звонок друзьям", "Созвониться с другом, с которым давно не удавалось поговорить, и обменяться планами на праздники."],
    ["Один дома", "Заказать пиццу, включить «Один дома» и поболеть за Кевина, пока он готовит свой самый хитрый праздничный план."],
    ["Семейная настолка", "Поиграть в настольную игру с семьёй."],
    ["Список желаний", "Составить список своих желаний на следующий год."],
    ["Самые счастливые моменты", "Подвести итоги года и вспомнить самые счастливые моменты."],
    ["Цели на будущий год", "Написать список целей на будущий год."],
    ["С Новым годом!", "Встретить Новый год с улыбкой и верой в чудо!"],
  ];

  const grid = document.querySelector("#adventGrid");
  const status = document.querySelector("#adventStatus");
  const dialog = document.querySelector("#adventCard");
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  const clock = new Intl.DateTimeFormat("ru-RU", {
    timeZone: "Europe/Moscow", year: "numeric", month: "numeric", day: "numeric",
  });
  const storageKey = `stickerbook-advent-${year}`;
  const opened = new Set();
  function restoreOpened() {
    try {
      const stored = JSON.parse(localStorage.getItem(storageKey) ?? "[]");
      if (!Array.isArray(stored)) return;
      for (const day of stored) {
        if (Number.isInteger(day) && day >= 1 && day <= activities.length) opened.add(day);
      }
    } catch {}
  }
  restoreOpened();
  let opening = false;

  function availability(now = new Date()) {
    const { year: currentYear, month, day } = Object.fromEntries(
      clock.formatToParts(now).filter(part => part.type !== "literal")
        .map(part => [part.type, Number(part.value)])
    );
    if (currentYear < year || (currentYear === year && month < 12)) return { last: 0, today: 0 };
    if (currentYear > year) return { last: 31, today: 0 };
    return { last: day, today: day };
  }

  function refresh() {
    const { last, today } = availability();
    status.textContent = !last ? `Старт 1 декабря ${year} года по Москве.` :
      today ? "Открывай сегодняшнее окошко и любые пропущенные." : "Все окошки доступны.";
    const visibleOpened = [...opened].filter(day => day <= last).length;
    document.querySelector("#adventProgress").value = visibleOpened;
    document.querySelector("#adventCount").textContent = `Открыто ${visibleOpened} из 31`;
    buttons.forEach((button, index) => {
      const day = index + 1;
      const locked = day > last;
      button.setAttribute("aria-disabled", String(locked));
      button.toggleAttribute("data-today", day === today);
      button.toggleAttribute("data-opened", !locked && opened.has(day));
      button.setAttribute("aria-label", `${day} декабря${locked ? ", ещё закрыто" : opened.has(day) ? ", уже открыто" : ""}`);

    });
    return last;
  }

  const pictureTurn = { start: .17, end: .48 };
  const taskTurn = { start: .62, end: .96 };

  function bendCard(rotor, duration) {
    const width = rotor.offsetWidth;
    if (!width) return () => {};

    const layer = document.createElement("div");
    layer.className = "advent-curl";
    layer.setAttribute("aria-hidden", "true");
    layer.inert = true;
    const faces = [...rotor.children];
    const strips = 20;
    const animations = [];
    for (let index = 0; index < strips; index++) {
      const strip = document.createElement("div");
      strip.className = "advent-curl-strip";
      const center = (index + .5) / strips;
      strip.style.transformOrigin = `${center * 100}% 50%`;
      faces.forEach((face, side) => {
        const copy = face.cloneNode(true);
        for (const element of copy.querySelectorAll("[id]")) element.removeAttribute("id");
        const column = side === 0 ? strips - index - 1 : index;
        copy.style.clipPath = `inset(0 max(0px, ${100 - (column + 1) * 100 / strips}% - .35px)
          0 max(0px, ${column * 100 / strips}% - .35px))`;
        strip.append(copy);
      });
      layer.append(strip);

      const flatX = (center - .5) * width;
      const keyframes = [{ offset: 0, transform: "none" }];
      for (const { start, end } of [pictureTurn, taskTurn]) {
        for (let step = 0; step <= 24; step++) {
          const progress = step / 24;
          const offset = start + (end - start) * progress;
          // The bend peaks halfway through the turn, then eases back to flat.
          const arc = Math.PI * .98 * Math.sin(Math.PI * progress) ** 2;
          if (arc < .0001) {
            keyframes.push({ offset, transform: "none" });
            continue;
          }
          const angle = arc * (center - .5);
          const radius = width / arc;
          const x = radius * Math.sin(angle) - flatX;
          const z = radius * (1 - Math.cos(angle));
          keyframes.push({ offset, transform: `translate3d(${x}px,0,${z}px) rotateY(${-angle}rad)` });
        }
      }
      keyframes.push({ offset: 1, transform: "none" });
      animations.push({ strip, keyframes });
    }
    rotor.append(layer);
    rotor.setAttribute("data-bending", "");
    const flights = animations.map(({ strip, keyframes }) =>
      strip.animate(keyframes, { duration, easing: "linear", fill: "both" })
    );
    return () => {
      flights.forEach(animation => animation.cancel());
      layer.remove();
      rotor.removeAttribute("data-bending");
    };
  }

  function openDay(day, button) {
    if (opening || dialog.open || day > refresh()) return;
    opening = true;
    restoreOpened();
    opened.add(day);
    try { localStorage.setItem(storageKey, JSON.stringify([...opened])); } catch {}
    refresh();
    const [title, description] = activities[day - 1];
    document.querySelector("#activityDate").textContent = `${day} декабря`;
    document.querySelector("#activityTitle").textContent = title;
    document.querySelector("#activityText").textContent = description;
    const animate = !motion.matches;

    function showCard() {
      const source = animate ? button.querySelector(".advent-card-edge").getBoundingClientRect() : null;
      dialog.showModal();
      if (source) {
        const target = dialog.getBoundingClientRect();
        const x = source.left + source.width / 2 - target.left - target.width / 2;
        const y = source.top + source.height / 2 - target.top - target.height / 2;
        const launchScale = Math.min(.25, Math.max(.07, source.height / target.height));
        button.removeAttribute("data-extracting");
        const rotor = dialog.querySelector(".advent-card-rotor");
        const duration = 2800;
        rotor.style.setProperty("--flight-duration", `${duration}ms`);
        const flatten = bendCard(rotor, duration);
        const flight = rotor.animate([
          { transform: `perspective(950px) translate3d(${x}px,${y}px,0) scale(${launchScale}) rotateY(88deg) rotateZ(-10deg)` },
          { offset: pictureTurn.start, easing: "cubic-bezier(.42,0,.58,1)", transform: `perspective(950px) translate3d(${x * .54}px,${y * .54}px,38px) scale(.43) rotateY(90deg) rotateZ(-12deg)` },
          { offset: pictureTurn.end, transform: "perspective(950px) translate3d(0,-14px,76px) scale(.82) rotateY(180deg) rotateZ(5deg)" },
          { offset: taskTurn.start, easing: "cubic-bezier(.42,0,.58,1)", transform: "perspective(950px) translate3d(0,-14px,76px) scale(.82) rotateY(180deg) rotateZ(2deg)" },
          { offset: taskTurn.end, easing: "ease-out", transform: "perspective(950px) translate3d(0,0,18px) scale(.97) rotateY(360deg) rotateZ(0deg)" },
          { transform: "perspective(950px) translate3d(0,0,0) scale(1) rotateY(360deg) rotateZ(0deg)" },
        ], { duration, easing: "linear" });
        const cancelFlight = () => flight.cancel();
        dialog.addEventListener("close", cancelFlight, { once: true });
        const finish = () => {
          dialog.removeEventListener("close", cancelFlight);
          flatten();
          button.removeAttribute("data-opening");
        };
        flight.finished.then(finish, finish);
      }
      opening = false;
    }

    if (animate) {
      button.setAttribute("data-opening", "");
      button.setAttribute("data-extracting", "");
      setTimeout(showCard, 620);
    } else showCard();
  }

  const buttons = activities.map((_, index) => {
    const day = index + 1;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "advent-window";
    button.toggleAttribute("data-wide", [1, 5, 8, 12, 13, 17, 20, 23, 25, 29].includes(day));
    const shapes = ["house", "bauble", "star", "tree", "tag", "heart", "arch"];
    button.dataset.shape = day === 31 ? "bow" : shapes[index % shapes.length];
    const motif = ["✧", "❅", "✦", "❋", "✷"][index % 5];
    button.innerHTML = `<span class="advent-inside" aria-hidden="true"><span class="advent-inside-number">${day}</span></span>
      <span class="advent-card-edge" aria-hidden="true"></span>
      <span class="advent-door" aria-hidden="true"><span class="advent-number">${day}</span>
      <span class="advent-motif">${motif}</span></span>`;
    button.addEventListener("click", () => openDay(day, button));
    grid.append(button);
    return button;
  });
  refresh();
  if (!motion.matches) {
    const stage = document.querySelector("#adventStage");
    grid.inert = true;
    stage.classList.add("advent-intro");
    setTimeout(() => {
      stage.classList.remove("advent-intro");
      grid.inert = false;
    }, 1730);
  }
  setInterval(refresh, 15000);
  window.addEventListener("pageshow", () => {
    restoreOpened();
    refresh();
  });
  window.addEventListener("storage", event => {
    if (event.key !== storageKey) return;
    restoreOpened();
    refresh();
  });
</script>
</body>
</html>
