<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новогодний адвент — TravelAsk Стикербук</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="darkfix.css?v=2">
<style>
  .advent {
    --gold: #e7c489; --cream: #fff2d6; --pine: #123b36; --red: #843345;
    position: relative; isolation: isolate; max-width: 1040px; margin: 28px auto 40px;
    padding: clamp(14px, 3.6vw, 39px);
    color: var(--cream); border: 1px solid #b69058; border-radius: 13px;
    background:
      radial-gradient(circle at 13% 21%, #f8d9a12b 0 1px, transparent 2px) 0 0 / 27px 29px,
      radial-gradient(ellipse at top, #306554, transparent 72%), #143c37;
    box-shadow: 0 7px 0 #10312e, 0 10px 0 #ac8651, 0 16px 0 #102c27, 0 28px 44px #28211755;
  }
  .advent::before {
    content: ""; position: absolute; inset: 7px; z-index: -1;
    border: 1px solid #edc78c78; border-radius: 8px; pointer-events: none;
  }
  .advent-lid { position: relative; text-align: center; padding: clamp(31px, 6vw, 62px) 8px 24px; }
  .advent-bow {
    position: absolute; top: -9px; left: 50%; translate: -50% 0; width: 28px; height: 23px;
    border-radius: 7px; z-index: 1;
    background: linear-gradient(145deg, #c86f71, #863344 68%);
    box-shadow: inset 0 0 0 1px #f7c0a18c, 0 3px 7px #102823;
  }
  .advent-bow::before, .advent-bow::after {
    content: ""; position: absolute; top: -6px; width: 38px; height: 26px;
    z-index: -1; border: 1px solid #f3bc9c9c;
    background: radial-gradient(ellipse at center, #592434 17%, #a84958 57%, #c77274 82%);
  }
  .advent-bow::before { right: 18px; border-radius: 65% 48% 30% 65%; rotate: 20deg; }
  .advent-bow::after { left: 18px; border-radius: 48% 65% 65% 30%; rotate: -20deg; }
  .advent-lid h1 { margin: 0; font: 700 clamp(32px, 7vw, 75px)/1 Georgia, serif; text-wrap: balance; }
  .advent-status { margin: 12px auto 0; line-height: 1.45; color: #ffedc8; }
  .advent-progress {
    display: inline-flex; gap: 9px; align-items: center; margin: 14px auto 0;
    color: #ffe6b8; font-size: 12px;
  }
  .advent-progress progress { width: 72px; height: 7px; accent-color: #f2ce8e; }
  .advent-grid {
    display: grid; grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-auto-rows: clamp(58px, 9.2vw, 98px); gap: clamp(6px, 1.2vw, 13px);
    padding: clamp(8px, 1.7vw, 17px); border: 1px solid #d3a95c83; border-radius: 7px;
    background: #0827249e; box-shadow: inset 0 3px 14px #041b19aa;
  }
  .advent-window {
    --door: #376859; --light: #76a18b;
    position: relative; display: grid; place-items: center; padding: 0;
    perspective: 460px; color: var(--cream); border: 1px solid #bda071a6;
    border-radius: 5px; background: radial-gradient(ellipse, #634e31, #101c19 76%);
    box-shadow: inset 0 3px 8px #111a16, 0 2px 2px #041813; cursor: pointer;
  }
  .advent-window:nth-child(3n + 2) { --door: #853e4c; --light: #ba7981; }
  .advent-window:nth-child(3n) { --door: #3b566b; --light: #7e9fb1; }
  .advent-window[data-wide] { grid-column: span 2; }
  .advent-window:last-child {
    grid-column: 1 / -1; --door: #84374a; --light: #cb887c;
    border-color: #e9c078;
  }
  .advent-door {
    display: grid; position: absolute; inset: 0; place-content: center;
    transform-origin: left center; pointer-events: none; border-radius: 4px;
    background: radial-gradient(ellipse at top right, var(--light), transparent 87%), var(--door);
    transition: transform 300ms ease, filter 180ms ease;
    box-shadow: inset 0 0 0 1px #f7dba555, inset 0 -3px 8px #17292477;
  }
  .advent-door::before {
    content: ""; position: absolute; inset: 4px; border: 1px dashed #f8daa488; border-radius: 3px;
  }
  .advent-door::after {
    content: ""; position: absolute; top: calc(50% - 7px); right: -1px;
    width: 6px; height: 14px; border-radius: 6px 0 0 6px; background: #1b3028ba;
  }
  .advent-number { position: relative; font: 700 clamp(21px, 3.1vw, 37px)/1 Georgia, serif; text-shadow: 0 1px 3px #172b28; }
  .advent-motif { font: 700 15px/1 Georgia, serif; color: #ffe0a6; margin-top: 3px; }
  .advent-inside { display: grid; place-items: center; width: 65%; height: 58%; border-radius: 3px;
    color: #604834; background: #f2d8a8; rotate: 7deg; box-shadow: 0 0 13px #ecc9856b; }
  .advent-window[aria-disabled="true"] { cursor: default; }
  .advent-window[aria-disabled="true"] .advent-door { filter: saturate(.68) brightness(.86); }
  .advent-window[data-today] { outline: 2px solid #ffdc90; outline-offset: 2px; }
  .advent-window:focus-visible { outline: 3px solid #fff2c9; outline-offset: 3px; z-index: 3; }
  .advent-window[data-opened] .advent-door { transform: rotateY(-24deg); }
  @media (hover: hover) {
    .advent-window:not([aria-disabled="true"]):not([data-opening]):hover .advent-door { transform: rotateY(-37deg); filter: brightness(1.13); }
  }
  .advent-window[data-opening] { z-index: 4; }
  .advent-window[data-opening] .advent-door { transform: rotateY(-118deg); }
  .advent-card {
    width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
    padding: clamp(23px, 6vw, 42px); color: #2d3c31; border: 1px solid #ab8153;
    border-radius: 6px; background: repeating-linear-gradient(0deg, #ac895616 0 1px, transparent 1px 24px), #fff4dc;
    box-shadow: inset 0 0 0 7px #e3ba8255, 0 20px 65px #10201b80;
  }
  .advent-card::backdrop { background: #081a199b; }
  .advent-card h2 { margin: 10px 0 12px; font: 700 clamp(26px, 5vw, 38px)/1.08 Georgia, serif; }
  .advent-card p { line-height: 1.55; }
  .advent-date { font-weight: 750; color: #78384a; }
  .advent-close { color: #263b31; cursor: pointer; }
  @media (max-width: 640px) {
    .advent-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .advent-window[data-wide] { grid-column: auto; }
    .advent-window:first-child, .advent-window:nth-child(20) { grid-column: span 2; }
    .advent { margin-top: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .advent-door { transition: none; } }
  .advent-stage {
    perspective: 1800px; overflow: clip; padding: 12px 6px 28px;
  }
  .advent { transform-origin: center 93%; margin-bottom: 24px; }
  .advent-intro .advent { animation: raise-box 1050ms cubic-bezier(.25,.7,.24,1) both; }
  @keyframes raise-box {
    0% { transform: translateY(9%) rotateX(76deg) rotateZ(-4deg) scale(.91); }
    69% { transform: translateY(-2%) rotateX(-7deg) rotateZ(1deg); }
    100% { transform: none; }
  }
  .advent-covers {
    position: absolute; inset: 0; z-index: 8; visibility: hidden;
    perspective: 1400px; pointer-events: none;
  }
  .advent-intro .advent-covers { animation: cover-visibility 2050ms step-end both; }
  @keyframes cover-visibility { from { visibility: visible; } to { visibility: hidden; } }
  .advent-cover {
    position: absolute; inset-block: 0; width: 50%;
    border: 1px solid #e3b87e; transform-style: preserve-3d;
    box-shadow: inset 0 0 0 5px #713141, inset 0 0 0 7px #d9ac72, 0 4px 12px #26131588;
    background:
      radial-gradient(circle, #ffe6b3a0 0 1px, transparent 2px) 3px 12px / 24px 27px,
      repeating-linear-gradient(135deg, #fff0c416 0 2px, transparent 2px 19px),
      linear-gradient(145deg, #a44755, #632638);
  }
  .advent-cover--left { left: 0; transform-origin: left center; border-radius: 12px 0 0 12px; --turn: -103deg; }
  .advent-cover--right { right: 0; transform-origin: right center; border-radius: 0 12px 12px 0; --turn: 103deg; }
  .advent-intro .advent-cover { animation: open-covers 1000ms 990ms cubic-bezier(.24,.66,.2,1) both; }
  @keyframes open-covers { from { transform: rotateY(0); } to { transform: rotateY(var(--turn)); } }
  .advent-cover::before {
    content: ""; position: absolute; inset: 0; margin: auto 0; height: clamp(24px, 5vw, 59px);
    background: linear-gradient(#f3cf92, #a87949 9%, #d7a560 45%, #ecc387 88%, #805a41);
    box-shadow: 0 3px 8px #401c2999;
  }
  .advent-cover::after {
    content: "❄"; position: absolute; inset: 18% 0 auto;
    color: #ffe5a9; text-align: center; font: clamp(36px, 10vw, 120px)/1 Georgia, serif;
    text-shadow: 0 2px 8px #502433;
  }
  .advent-lid::after {
    content: "✦  ❄  ✧"; position: absolute; inset: 5px 0 auto; z-index: -1;
    color: #e7c489; text-align: center; letter-spacing: clamp(22px, 8vw, 100px);
    padding-left: clamp(22px, 8vw, 100px); opacity: .8;
  }
  .advent-window, .advent-window:last-child {
    border: 0; background: transparent; box-shadow: none;
    --shape: inset(3% 5% round 38% 38% 8% 8%);
  }
  .advent-window[data-shape="bauble"] { --shape: ellipse(45% 49% at 50% 50%); }
  .advent-window[data-shape="tree"] { --shape: polygon(50% 0, 74% 28%, 66% 28%, 86% 53%, 75% 53%, 97% 85%, 61% 85%, 61% 99%, 39% 99%, 39% 85%, 3% 85%, 25% 53%, 14% 53%, 34% 28%, 26% 28%); }
  .advent-window[data-shape="star"] { --shape: polygon(50% 0, 63% 23%, 91% 15%, 83% 42%, 100% 58%, 75% 68%, 77% 95%, 50% 82%, 23% 95%, 25% 68%, 0 58%, 17% 42%, 9% 15%, 37% 23%); }
  .advent-window[data-shape="house"] { --shape: polygon(50% 1%, 98% 39%, 90% 39%, 90% 96%, 10% 96%, 10% 39%, 2% 39%); }
  .advent-window[data-shape="tag"] { --shape: polygon(14% 3%, 86% 3%, 99% 22%, 99% 80%, 85% 97%, 15% 97%, 1% 80%, 1% 22%); }
  .advent-window[data-shape="heart"] { --shape: polygon(50% 96%, 14% 63%, 4% 48%, 2% 32%, 7% 18%, 16% 9%, 28% 6%, 40% 10%, 50% 21%, 60% 10%, 72% 6%, 84% 9%, 93% 18%, 98% 32%, 96% 48%, 86% 63%); }
  .advent-window[data-shape="heart"] .advent-door, .advent-window[data-shape="heart"] .advent-inside { border-radius: 42% 42% 49% 49%; }
  .advent-window[data-shape="bow"] { --shape: polygon(2% 8%, 13% 5%, 45% 26%, 55% 26%, 87% 5%, 98% 8%, 98% 92%, 87% 95%, 55% 74%, 45% 74%, 13% 95%, 2% 92%); }
  .advent-door, .advent-inside { clip-path: var(--shape); }
  .advent-door::before { inset: 9%; opacity: .55; }
  .advent-door::after { right: 13%; width: 5px; height: 11px; background: #ffe2a3cc; }
  .advent-inside {
    position: absolute; inset: 0; width: auto; height: auto; rotate: none;
    background: radial-gradient(ellipse, #806541, #201813 74%); color: #f7d5a1;
  }
  .advent-window[data-shape="tree"] .advent-motif,
  .advent-window[data-shape="bow"] .advent-motif { display: none; }
  .advent-window[data-shape="tree"] .advent-number { translate: 0 6px; }
  .advent-window[data-today] { outline-style: dashed; }
  @media (prefers-reduced-motion: reduce) {
    .advent-intro .advent, .advent-intro .advent-cover, .advent-intro .advent-covers { animation: none; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <a class="brand" href="index.html"><div class="brand-title">TravelAsk ✈</div><div class="brand-sub">Стикербук</div></a>
    <nav class="nav" aria-label="Стикербук">
      <a class="pill mint" href="index.html">Команда</a>
      <a class="pill lav" href="achievements.html">Ачивки</a>
      <a class="pill" href="pets.html">Пушистые коллеги 🐾</a>
      <a class="pill mint" href="geography.html">География команды</a>
      <a class="pill lav" href="advent.html" aria-current="page">Адвент ❄</a>
    </nav>
  </header>
  <div class="advent-stage" id="adventStage">
  <section class="advent" aria-labelledby="advent-title">
    <div class="advent-lid">
      <span class="advent-bow" aria-hidden="true"></span>
      <h1 id="advent-title">Новогодний адвент</h1>
      <p class="advent-status" id="adventStatus" role="status"></p>
      <label class="advent-progress"><progress id="adventProgress" max="31" value="0"></progress><span id="adventCount">Открыто 0 из 31</span></label>
    </div>
    <div class="advent-grid" id="adventGrid"></div>
    <div class="advent-covers" aria-hidden="true">
      <div class="advent-cover advent-cover--left"></div>
      <div class="advent-cover advent-cover--right"></div>
    </div>
  </section>
  </div>
</main>
<dialog id="adventCard" class="advent-card" aria-labelledby="activityTitle">
  <div id="activityDate" class="advent-date"></div>
  <h2 id="activityTitle"></h2>
  <p id="activityText"></p>
  <form method="dialog"><button class="pill mint advent-close">Закрыть</button></form>
</dialog>
<script>
  const year = 2026;
  const activities = [
    ["Вечер уюта", "Устроить себе вечер уюта: свечи, тёплый плед и любимая музыка."],
    ["Список подарков", "Составить список подарков."],
    ["Гирлянды и снежинки", "Украсить дом гирляндами и бумажными снежинками."],
    ["Новогодний плейлист", "Послушать новогоднюю музыку."],
    ["Театр или выставка", "Сходить в театр или на выставку."],
    ["Прогулка за огоньками", "Прогуляться вечером и выбрать самую красивую праздничную витрину. Если погода не располагает, можно устроить такую прогулку в торговом центре."],
    ["Новогодняя открытка", "Выбрать или сделать новогоднюю открытку и написать в ней личное пожелание. Отправить её можно ближе к празднику."],
    ["Зима в Простоквашино", "Посмотреть «Зиму в Простоквашино» и окунуться в детские воспоминания."],
    ["Какао с зефирками", "Приготовить вкусное какао с зефирками."],
    ["Зимняя история", "Прочитать небольшой зимний рассказ или сказку. Можно начать с истории, которую давно хотелось перечитать."],
    ["Декор своими руками", "Сделать новогодний декор своими руками."],
    ["На каток", "Покататься на коньках."],
    ["Новогодняя ярмарка", "Сходить на новогоднюю ярмарку, чтобы пить глинтвейн и выбирать презенты близким."],
    ["Праздничное меню", "Запланировать праздничное меню."],
    ["Доброе дело", "Сделать доброе дело."],
    ["Красивая упаковка", "Научиться красиво упаковывать подарки."],
    ["Новый год в другой стране", "Узнать, как встречают Новый год в другой стране, и выбрать самую неожиданную традицию."],
    ["Новогоднее печенье", "Испечь новогоднее печенье."],
    ["Зимняя фотосессия", "Устроить зимнюю фотосессию."],
    ["Ёлка", "Нарядить ёлку, чтобы задать новогоднее настроение."],
    ["Зимний пазл", "Собрать небольшой пазл с зимним сюжетом. Подойдёт и онлайн-пазл."],
    ["Праздничный образ", "Примерить наряд на Новый год и выбрать одну деталь, которая поднимает настроение."],
    ["Новогодний фильм", "Посмотреть новогодний фильм, который создаёт настоящее праздничное настроение."],
    ["Танцевальная пауза", "Разучить пару танцевальных движений и устроить себе минуту танцев."],
    ["Звонок друзьям", "Созвониться с другом, с которым давно не удавалось поговорить, и обменяться планами на праздники."],
    ["Один дома", "Заказать пиццу, включить «Один дома» и поболеть за Кевина, пока он готовит свой самый хитрый праздничный план."],
    ["Семейная настолка", "Поиграть в настольную игру с семьёй."],
    ["Список желаний", "Составить список своих желаний на следующий год."],
    ["Самые счастливые моменты", "Подвести итоги года и вспомнить самые счастливые моменты."],
    ["Цели на будущий год", "Написать список целей на будущий год."],
    ["С Новым годом!", "Встретить Новый год с улыбкой и верой в чудо!"],
  ];

  const grid = document.querySelector("#adventGrid");
  const status = document.querySelector("#adventStatus");
  const dialog = document.querySelector("#adventCard");
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  const clock = new Intl.DateTimeFormat("ru-RU", {
    timeZone: "Europe/Moscow", year: "numeric", month: "numeric", day: "numeric",
  });
  const storageKey = `stickerbook-advent-${year}`;
  const opened = new Set();
  try {
    for (const day of JSON.parse(localStorage.getItem(storageKey) ?? "[]")) {
      if (Number.isInteger(day) && day >= 1 && day <= 31) opened.add(day);
    }
  } catch {}
  let opening = false;

  function availability(now = new Date()) {
    const { year: currentYear, month, day } = Object.fromEntries(
      clock.formatToParts(now).filter(part => part.type !== "literal")
        .map(part => [part.type, Number(part.value)])
    );
    if (currentYear < year || (currentYear === year && month < 12)) return { last: 0, today: 0 };
    if (currentYear > year) return { last: 31, today: 0 };
    return { last: day, today: day };
  }

  function refresh() {
    const { last, today } = availability();
    status.textContent = !last ? `Старт 1 декабря ${year} года по Москве.` :
      today ? "Открывай сегодняшнее окошко и любые пропущенные." : "Все окошки доступны.";
    const visibleOpened = [...opened].filter(day => day <= last).length;
    document.querySelector("#adventProgress").value = visibleOpened;
    document.querySelector("#adventCount").textContent = `Открыто ${visibleOpened} из 31`;
    buttons.forEach((button, index) => {
      const day = index + 1;
      const locked = day > last;
      button.setAttribute("aria-disabled", String(locked));
      button.toggleAttribute("data-today", day === today);
      button.toggleAttribute("data-opened", !locked && opened.has(day));
      button.setAttribute("aria-label", `${day} декабря${locked ? ", ещё закрыто" : opened.has(day) ? ", уже открыто" : ""}`);

    });
    return last;
  }

  function openDay(day, button) {
    if (opening || dialog.open || day > refresh()) return;
    opening = true;
    const alreadyOpened = opened.has(day);
    opened.add(day);
    try { localStorage.setItem(storageKey, JSON.stringify([...opened])); } catch {}
    refresh();
    const [title, description] = activities[day - 1];
    document.querySelector("#activityDate").textContent = `${day} декабря`;
    document.querySelector("#activityTitle").textContent = title;
    document.querySelector("#activityText").textContent = description;
    const animate = !motion.matches && !alreadyOpened;

    function showCard() {
      dialog.showModal();
      if (animate) {
        const source = button.getBoundingClientRect();
        const target = dialog.getBoundingClientRect();
        const x = source.left + source.width / 2 - target.left - target.width / 2;
        const y = source.top + source.height / 2 - target.top - target.height / 2;
        const flight = dialog.animate([
          { transform: `translate(${x}px, ${y}px) scale(.16) rotate(-9deg)`, opacity: .35 },
          { transform: "translate(0,-12px) scale(1.03) rotate(2deg)", offset: .76 },
          { transform: "none", opacity: 1 },
        ], { duration: 465, easing: "cubic-bezier(.2,.74,.3,1)" });
        const finish = () => button.removeAttribute("data-opening");
        flight.finished.then(finish, finish);
      }
      opening = false;
    }

    if (animate) {
      button.setAttribute("data-opening", "");
      setTimeout(showCard, 260);
    } else showCard();
  }

  const buttons = activities.map((_, index) => {
    const day = index + 1;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "advent-window";
    button.toggleAttribute("data-wide", [1, 5, 8, 12, 13, 17, 20, 23, 25, 29].includes(day));
    const shapes = ["house", "bauble", "star", "tree", "tag", "heart", "arch"];
    button.dataset.shape = day === 31 ? "bow" : shapes[index % shapes.length];
    const motif = ["✧", "❅", "✦", "❋", "✷"][index % 5];
    button.innerHTML = `<span class="advent-inside" aria-hidden="true">✦</span>
      <span class="advent-door" aria-hidden="true"><span class="advent-number">${day}</span>
      <span class="advent-motif">${motif}</span></span>`;
    button.addEventListener("click", () => openDay(day, button));
    grid.append(button);
    return button;
  });
  refresh();
  if (!motion.matches) {
    const stage = document.querySelector("#adventStage");
    grid.inert = true;
    stage.classList.add("advent-intro");
    setTimeout(() => {
      stage.classList.remove("advent-intro");
      grid.inert = false;
    }, 2050);
  }
  setInterval(refresh, 15000);
  window.addEventListener("pageshow", refresh);
</script>
</body>
</html>
