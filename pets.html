<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfaf5">
  <title>Пушистые коллеги — TravelAsk Стикербук</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="darkfix.css?v=2">
  <style>
    .pet-toolbar { margin: 0 0 24px; }
    .pet-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .pet-filters button { cursor: pointer; color: var(--ink); padding: 8px 15px; }
    .pet-filters button[aria-pressed="true"] { background: var(--mint); }
    .pet-toolbar .search { margin: 12px 0 0; }
    .pet-gallery [hidden], .pet-toolbar[hidden], .empty[hidden] { display: none; }
    .pet-prints { display: grid; isolation: isolate; }
    .pet-prints[data-paired] {
      margin: 0 clamp(9px, 5%, 15px) 0 3px;
      padding: 3px 3px 8px 0;
    }
    .pet-print { grid-area: 1 / 1; min-width: 0; }
    .pet-prints[data-paired] .pet-print {
      position: relative; padding: 4px 4px 10px;
      border: 1px solid #e6dccb; background: #fffdf8;
      box-shadow: 0 4px 9px #46352835;
      transform: translate(8%, 1%) rotate(8deg);
      transition: transform 240ms ease;
    }
    .pet-prints[data-paired] .pet-print[data-front] {
      z-index: 1; transform: translate(-1%, 0) rotate(-3deg);
    }
    @media (prefers-reduced-motion: reduce) {
      .pet-prints[data-paired] .pet-print { transition: none; }
    }
    .pet-photo-open {
      display: block; width: 100%; padding: 0; border: 0;
      background: transparent; cursor: zoom-in;
    }
    .pet-photo-dialog {
      max-width: calc(100vw - 24px); max-height: calc(100dvh - 24px);
      padding: 8px; border: 1px solid #ddd4c7; border-radius: 4px;
      background: #fffdf8; box-shadow: 0 15px 45px #201a1766;
    }
    .pet-photo-dialog::backdrop { background: #211b17c9; }
    .pet-photo-close {
      display: block; padding: 0; border: 0;
      background: transparent; cursor: zoom-out;
    }
    .pet-photo-close img {
      display: block; width: auto; height: auto;
      max-width: min(960px, calc(100vw - 42px));
      max-height: calc(100dvh - 42px);
    }
    .pet-photo-toggle {
      display: block; margin: 6px auto 0; padding: 5px 10px;
      border: 1px solid var(--line); border-radius: 999px;
      background: #edf3e9; color: #334636; cursor: pointer;
      font: inherit; font-size: 13px;
    }
    .pet-owner {
      border: 0; background: transparent; color: inherit; padding: 4px;
      cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    }
    .pet-gallery .member-name, .pet-gallery .member-role { overflow-wrap: anywhere; }
    .nav [aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="brand" href="index.html"><div class="brand-title">TravelAsk ✈</div><div class="brand-sub">Стикербук</div></a>
      <nav class="nav">
        <a class="pill mint" href="index.html">Команда</a>
        <a class="pill lav" href="achievements.html">Ачивки</a>
        <a class="pill" href="pets.html" aria-current="page">Пушистые коллеги 🐾</a>
      <a class="pill mint" href="geography.html">География команды</a><a class="pill lav" href="advent.html">Адвент ❄</a></nav>
    </header>
    <h1 class="section-label">Секретный отдел контроля качества</h1>
    <section class="pet-toolbar" id="petToolbar" aria-label="Фильтры питомцев" hidden>
      <div class="pet-filters" role="group" aria-label="Вид питомца">
        <button class="pill" type="button" data-filter="all" aria-pressed="true">Все</button>
        <button class="pill" type="button" data-filter="cat" aria-pressed="false">Кошки 🐱</button>
        <button class="pill" type="button" data-filter="dog" aria-pressed="false">Собаки 🐶</button>
        <button class="pill" type="button" data-filter="other" aria-pressed="false">Другие питомцы 🐾</button>
      </div>
      <div class="search">
        <input id="petSearch" type="search" aria-label="Найти по кличке или имени хозяина"
          placeholder="Найти по кличке или имени хозяина" autocomplete="off">
      </div>
    </section>
    <div class="team-grid pet-gallery" id="petGallery">
      <!-- Для каждого питомца скопируй блок от <article> до </article> и вставь
           его после этого комментария, перед закрывающим тегом галереи.
           Категории: cat — кошки, dog — собаки, other — другие питомцы.
           Фото загрузи в папку pets. Подставь фактические имена файлов в src.
           Если фото одно, удали весь второй блок <span class="pet-print">.
           Для каждого снимка обнови alt. Оставь hidden у второго блока и кнопки.
         -->

      <article class="member-card" data-kind="cat">
        <div class="photo-paper">
          <div class="pet-prints">
            <span class="pet-print"><img class="pet-photo" src="pets/black_coat1.jpg" alt="Черный плащ — первое фото" loading="lazy"></span>
            <span class="pet-print" hidden><img class="pet-photo" src="pets/black_coat2.jpg" alt="Черный плащ — второе фото" loading="lazy"></span>
          </div>
          <button class="pet-photo-toggle" type="button" hidden>Ещё фото</button>
          <h2 class="member-name">Черный плащ</h2>
          <div class="member-role">
            <button class="pet-owner" type="button">Яна Молчанова</button>
          </div>
        </div>
      </article>
       <article class="member-card" data-kind="dog">
        <div class="photo-paper">
          <div class="pet-prints">
            <span class="pet-print"><img class="pet-photo" src="pets/panda1.jpg" alt="Панда — первое фото" loading="lazy"></span>
            <span class="pet-print" hidden><img class="pet-photo" src="pets/panda2.jpg" alt="Панда — второе фото" loading="lazy"></span>
          </div>
          <button class="pet-photo-toggle" type="button" hidden>Ещё фото</button>
          <h2 class="member-name">Панда</h2>
          <div class="member-role">
            <button class="pet-owner" type="button">Яна Молчанова</button>
          </div>
        </div>
      </article>
       </div>
    <p class="empty" id="petEmpty" role="status">Первые фотокарточки питомцев скоро появятся ♡</p>
    <footer class="footer"><span>Больше, чем ачивки ♡</span><span>TravelAsk</span></footer>
  </main>
  <dialog class="pet-photo-dialog" id="petPhotoDialog" aria-label="Увеличенное фото питомца">
    <button type="button" class="pet-photo-close" aria-label="Закрыть увеличенное фото">
      <img alt="">
    </button>
  </dialog>
  <script>
    const gallery = document.querySelector("#petGallery");
    const toolbar = document.querySelector("#petToolbar");
    const search = document.querySelector("#petSearch");
    const empty = document.querySelector("#petEmpty");
    const filters = [...toolbar.querySelectorAll("[data-filter]")];
    const cards = [...gallery.querySelectorAll(".member-card")];
    const normalize = value => value.trim().toLowerCase().replaceAll("ё", "е").replace(/\s+/g, " ");
    let category = "all";
    let selectedOwner = "";

    function updateGallery() {
      const query = normalize(search.value);
      let visible = 0;
      for (const card of cards) {
        const owner = normalize(card.querySelector(".pet-owner")?.textContent ?? "");
        const name = normalize(card.querySelector(".member-name")?.textContent ?? "");
        const kind = card.dataset.kind || "other";
        const matchesSearch = selectedOwner ? owner === selectedOwner :
          query.split(" ").every(word => name.includes(word) || owner.includes(word));
        card.hidden = (category !== "all" && category !== kind) || !matchesSearch;
        if (!card.hidden) visible++;
      }
      empty.hidden = visible > 0;
      for (const button of filters) {
        button.setAttribute("aria-pressed", String(button.dataset.filter === category));
      }
    }

    const photoDialog = document.querySelector("#petPhotoDialog");
    const fullPhoto = photoDialog.querySelector("img");
    const closePhoto = photoDialog.querySelector("button");

    closePhoto.addEventListener("click", () => photoDialog.close());
    photoDialog.addEventListener("click", event => {
      if (event.target === photoDialog) photoDialog.close();
    });

    for (const photo of gallery.querySelectorAll(".photo-paper img")) {
      const openPhoto = document.createElement("button");
      openPhoto.type = "button";
      openPhoto.className = "pet-photo-open";
      openPhoto.setAttribute("aria-label", photo.alt ? `Увеличить фото: ${photo.alt}` : "Увеличить фото");
      photo.before(openPhoto);
      openPhoto.append(photo);
      openPhoto.addEventListener("click", () => {
        fullPhoto.src = photo.currentSrc || photo.src;
        fullPhoto.alt = photo.alt;
        photoDialog.showModal();
      });
    }

    if (cards.length) {
      empty.textContent = "Питомцы не найдены. Попробуй изменить поиск или выбрать «Все» ♡";
      toolbar.hidden = false;
      for (const button of filters) {
        button.addEventListener("click", () => {
          category = button.dataset.filter;
          updateGallery();
        });
      }
      search.addEventListener("input", () => {
        selectedOwner = "";
        updateGallery();
      });
      for (const card of cards) {
        const stack = card.querySelector(".pet-prints");
        const toggle = card.querySelector(".pet-photo-toggle");
        if (!stack || !toggle) continue;
        const prints = stack.querySelectorAll(".pet-print");
        if (prints.length !== 2) continue;

        stack.setAttribute("data-paired", "");
        prints[1].hidden = false;
        toggle.hidden = false;
        let current = 0;
        function updatePrints() {
          prints.forEach((print, index) => {
            print.toggleAttribute("data-front", index === current);
          });
          toggle.textContent = current === 0 ? "Ещё фото" : "Первое фото";
        }
        toggle.addEventListener("click", () => {
          current = 1 - current;
          updatePrints();
        });
        updatePrints();
      }
      gallery.addEventListener("click", event => {
        const owner = event.target.closest(".pet-owner");
        if (!owner) return;
        search.value = owner.textContent.trim();
        selectedOwner = normalize(search.value);
        category = "all";
        updateGallery();
      });
      updateGallery();
    }
  </script>
</body>
</html>
