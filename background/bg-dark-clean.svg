<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#2b271f"/>
    <stop offset="48%" stop-color="#26231c"/>
    <stop offset="100%" stop-color="#302b22"/>
  </linearGradient>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="64" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.11"/></feComponentTransfer>
  </filter>
  <pattern id="fibers" width="120" height="120" patternUnits="userSpaceOnUse">
    <path d="M6 24 C38 18,82 31,114 22" fill="none" stroke="#7f7564" stroke-width="1.2" opacity=".16"/>
    <path d="M11 70 C48 62,88 79,116 68" fill="none" stroke="#776e60" stroke-width="1.1" opacity=".14"/>
    <path d="M38 5 C48 34,42 74,51 114" fill="none" stroke="#72695c" stroke-width=".9" opacity=".11"/>
  </pattern>
</defs>

<rect width="1800" height="1200" fill="url(#paper)"/>
<rect width="1800" height="1200" fill="url(#fibers)"/>
<rect width="1800" height="1200" filter="url(#grain)" opacity=".9"/>

<!-- subtle accents only; no large polygonal paper scraps -->
<g opacity=".16">
  <rect x="260" y="110" width="145" height="24" rx="3" fill="#b38f46" transform="rotate(-6 260 110)"/>
  <rect x="1320" y="515" width="155" height="24" rx="3" fill="#8c6b7b" transform="rotate(6 1320 515)"/>
  <rect x="790" y="1035" width="145" height="23" rx="3" fill="#8aa99d" transform="rotate(-4 790 1035)"/>
</g>

<g fill="none" stroke="#8a7d6a" stroke-width="3" opacity=".12" stroke-linecap="round">
  <path d="M145 475 C315 445,470 454,625 435"/>
  <path d="M155 493 C325 465,480 474,635 455"/>
  <path d="M1180 390 C1340 360,1490 370,1650 348"/>
  <path d="M1190 408 C1350 379,1500 388,1660 367"/>
  <path d="M600 790 C760 760,925 770,1075 748"/>
</g>

<g opacity=".12">
  <rect x="860" y="170" width="82" height="18" rx="9" fill="#9b6f7c"/>
  <rect x="950" y="170" width="82" height="18" rx="9" fill="#718f83"/>
  <rect x="1040" y="170" width="82" height="18" rx="9" fill="#a88d49"/>
</g>
</svg>