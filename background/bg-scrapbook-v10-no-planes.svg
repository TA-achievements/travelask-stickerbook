<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fffaf2"/>
    <stop offset="48%" stop-color="#f6eee2"/>
    <stop offset="100%" stop-color="#fbf7ef"/>
  </linearGradient>

  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="52" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.075"/></feComponentTransfer>
  </filter>

  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>

  <pattern id="fibers" width="120" height="120" patternUnits="userSpaceOnUse">
    <path d="M6 24 C38 18,82 31,114 22" fill="none" stroke="#cdbda8" stroke-width="1.2" opacity=".18"/>
    <path d="M11 70 C48 62,88 79,116 68" fill="none" stroke="#d0c1af" stroke-width="1.2" opacity=".15"/>
    <path d="M38 5 C48 34,42 74,51 114" fill="none" stroke="#d0c1af" stroke-width=".9" opacity=".12"/>
  </pattern>

  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#9fb9b3" stroke-width="1" opacity=".40"/>
  </pattern>
</defs>

<rect width="1800" height="1200" fill="url(#paper)"/>
<rect width="1800" height="1200" fill="url(#fibers)"/>
<rect width="1800" height="1200" filter="url(#grain)" opacity=".9"/>

<!-- pastel paper washes -->
<path d="M-80 120 C180 20,420 60,610 190 C720 265,700 360,560 430 C360 530,115 505,-65 375 Z"
      fill="#eecbd4" opacity=".22" filter="url(#blur)"/>
<path d="M1180 70 C1420 -20,1700 70,1870 260 C1760 425,1515 480,1280 415 C1135 370,1080 185,1180 70 Z"
      fill="#cae4d8" opacity=".22" filter="url(#blur)"/>
<path d="M470 825 C730 705,1090 735,1390 930 C1250 1110,930 1190,630 1085 Z"
      fill="#efdcaa" opacity=".18" filter="url(#blur)"/>

<!-- central scrapbook pieces removed -->

<!-- graph-paper blocks -->
<g opacity=".17">
  <rect x="735" y="405" width="220" height="120" rx="6" fill="#eff6f3"/>
  <rect x="735" y="405" width="220" height="120" rx="6" fill="url(#grid)"/>
  <rect x="1040" y="540" width="205" height="110" rx="6" fill="#f5eff1"/>
  <rect x="1040" y="540" width="205" height="110" rx="6" fill="url(#grid)"/>
</g>

<!-- map scraps removed -->

<g fill="none" stroke="#829da5" stroke-width="3" opacity=".27" stroke-linecap="round" stroke-linejoin="round">
  <path d="M150 155 l46 -17 56 24 42 -16"/>
  <path d="M170 184 l40 12 32 -14 50 17"/>
  <path d="M1435 145 l54 -20 62 26 48 -17"/>
  <path d="M1468 177 l45 10 37 -18 60 20"/>
</g>

<!-- ticket cards -->
<g opacity=".25">
  <rect x="280" y="690" width="178" height="96" rx="10" fill="#f4e4cc" stroke="#bca78d" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="1210" y="700" width="185" height="98" rx="10" fill="#f0dfe5" stroke="#baa28c" stroke-width="3" stroke-dasharray="7 6"/>
</g>
<g fill="none" stroke="#a99782" stroke-width="2.5" opacity=".23">
  <path d="M305 718h118"/><path d="M305 746h91"/><path d="M305 770h104"/>
  <path d="M1240 728h120"/><path d="M1240 756h92"/><path d="M1240 780h108"/>
</g>

<!-- washi tape -->
<g opacity=".32">
  <rect x="250" y="92" width="145" height="25" rx="3" fill="#e4bb50" transform="rotate(-6 250 92)"/>
  <rect x="695" y="365" width="145" height="24" rx="3" fill="#a9d2c0" transform="rotate(4 695 365)"/>
  <rect x="1315" y="515" width="155" height="25" rx="3" fill="#d99fbd" transform="rotate(6 1315 515)"/>
  <rect x="795" y="1035" width="145" height="24" rx="3" fill="#e8c964" transform="rotate(-4 795 1035)"/>
</g>

<!-- handwritten strokes -->
<g fill="none" stroke="#a99a87" stroke-width="3" opacity=".20" stroke-linecap="round">
  <path d="M150 475 C315 445,470 454,625 435"/>
  <path d="M160 493 C325 465,480 474,635 455"/>
  <path d="M1180 390 C1340 360,1490 370,1650 348"/>
  <path d="M1190 408 C1350 379,1500 388,1660 367"/>
</g>

<!-- paperclip marks -->
<g fill="none" stroke="#9e9080" stroke-width="4" opacity=".22" stroke-linecap="round">
  <path d="M165 615 c18-34 57-5 36 23 l-29 36 c-25 31-65-5-40-35 l25-31 c16-20 42 3 27 21 l-23 28"/>
  <path d="M1560 770 c20-37 62-4 39 27 l-32 39 c-27 33-70-6-43-38 l27-33 c17-21 45 3 29 23 l-25 30"/>
</g>

<!-- small color strips -->
<g opacity=".20">
  <rect x="860" y="170" width="82" height="18" rx="9" fill="#e7aebd"/>
  <rect x="950" y="170" width="82" height="18" rx="9" fill="#add5c4"/>
  <rect x="1040" y="170" width="82" height="18" rx="9" fill="#e8c96e"/>
  <rect x="570" y="1018" width="82" height="18" rx="9" fill="#c7b3dc"/>
  <rect x="660" y="1018" width="82" height="18" rx="9" fill="#b8dbce"/>
</g>
</svg>