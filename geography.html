<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfaf5">
  <title>География команды — TravelAsk Стикербук</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="darkfix.css?v=2">
  <style>
    .geo-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .geo-controls button { color: #292720; cursor: pointer; padding: 7px 14px; }
    .geo-controls button:disabled { opacity: .65; cursor: default; }
    .geo-viewport {
      overflow: auto; background: #e6eff6; border: 1px solid #a7bac4;
      border-radius: 16px; aspect-ratio: 2; box-shadow: var(--shadow);
    }
    .geo-world {
      position: relative; width: 100%; aspect-ratio: 2;
      background: url("geography-world.svg") center / 100% 100% no-repeat;
    }
    .geo-marker {
      position: absolute; transform: translate(-50%, -50%);
      min-width: 34px; min-height: 34px; padding: 0 5px; border: 2px solid white;
      border-radius: 999px; background: #644c80; color: white; cursor: pointer;
      box-shadow: 0 2px 6px #0005; font-size: 13px; font-weight: 800;
    }
    .geo-marker[aria-pressed="true"] { background: #3c2853; z-index: 1; }
    .geo-details { margin-top: 16px; padding: 16px; border-radius: 12px; background: #fffdf8; color: #292720; }
    .geo-details h2, .geo-details p { margin: 0; }
    .geo-details ul { margin-bottom: 0; }
    .geo-details a { text-decoration: underline; }
  </style>
  <script defer src="data.js"></script>
  <script defer src="geography-data.js"></script>
  <script defer src="geography.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="brand" href="index.html"><div class="brand-title">TravelAsk ✈</div><div class="brand-sub">Стикербук</div></a>
      <nav class="nav">
        <a class="pill mint" href="index.html">Команда</a>
        <a class="pill lav" href="achievements.html">Ачивки</a>
        <a class="pill" href="pets.html">Пушистые коллеги 🐾</a>
        <a class="pill mint" href="geography.html" aria-current="page">География команды</a>
      </nav>
    </header>
    <h1 class="section-label">География команды</h1>
    <div class="geo-controls">
      <button class="pill" type="button" id="zoomIn" aria-label="Приблизить карту">+</button>
      <button class="pill" type="button" id="zoomOut" aria-label="Отдалить карту" disabled>−</button>
      <button class="pill" type="button" id="zoomReset" disabled>Весь мир</button>
    </div>
    <div class="geo-viewport" id="mapViewport" role="region" aria-label="Карта мира. При увеличении прокручивается" tabindex="0">
      <div class="geo-world" id="worldMap"></div>
    </div>
    <section class="geo-details" id="placeDetails" aria-live="polite">
      <p>Здесь появятся города и страны нашей команды.</p>
    </section>
    <footer class="footer"><span>TravelAsk ♡</span><span>Карта на основе Natural Earth</span></footer>
  </main>
</body>
</html>
